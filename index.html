<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>陶艺拉坯全流程 AI知识库与智能问答系统</title>
<style>
:root {
  /* 国风陶棕配色 */
  --ik-brown: #996237;
  --ik-milk: #F8F3E9;
  --ik-sand: #E9DBCD;
  --ik-border: #D4B99C;
  --ik-bg: #FCF9F2;
  --clay: #c67b4b;
  --clay-light: #e8c9a0;
  --clay-dark: #8b4513;
  --clay-warm: #faf0e6;
  --glaze: #5b8c85;
  --glaze-light: #a8d8d0;
  --fire: #d4534a;
  --fire-light: #f4a8a0;
  --bg: #fdfaf6;
  --card: #ffffff;
  --text: #3d3226;
  --text-light: #7a6f64;
  --border: #e8ddd0;
  --shadow-sm: 0 1px 3px rgba(61,50,38,0.06), 0 1px 2px rgba(61,50,38,0.04);
  --shadow: 0 4px 16px rgba(61,50,38,0.07), 0 1px 4px rgba(61,50,38,0.04);
  --shadow-lg: 0 8px 32px rgba(61,50,38,0.1), 0 2px 8px rgba(61,50,38,0.05);
  --radius-sm: 8px;
  --radius: 14px;
  --radius-lg: 20px;
  --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  --glass: rgba(255,255,255,0.65);
  --glass-border: rgba(255,255,255,0.5);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--ik-bg);
  color: var(--text);
  line-height: 1.65;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ===== Header Banner ===== */
.header {
  position: relative; min-height: 150px;
  background:
    radial-gradient(ellipse at 8% 50%, rgba(153,98,55,0.18) 0px, transparent 80px),
    radial-gradient(ellipse at 92% 40%, rgba(153,98,55,0.15) 0px, transparent 90px),
    radial-gradient(ellipse at 25% 60%, rgba(153,98,55,0.08) 0px, transparent 120px),
    radial-gradient(ellipse at 70% 55%, rgba(153,98,55,0.08) 0px, transparent 100px),
    repeating-linear-gradient(90deg,transparent,transparent 38px,rgba(153,98,55,0.04) 38px,rgba(153,98,55,0.04) 39px),
    repeating-linear-gradient(0deg,transparent,transparent 52px,rgba(153,98,55,0.03) 52px,rgba(153,98,55,0.03) 53px),
    linear-gradient(180deg, #5C3A1E 0%, #7B4E2C 25%, #9A6B42 55%, #C49A6C 85%, #D4B99C 100%);
  color: #fff;
  box-shadow: 0 4px 24px rgba(61,50,38,0.25);
  position: sticky; top: 0; z-index: 100;
  overflow: hidden;
}

/* 左上角边角花纹 */
.header::before {
  content: '';
  position: absolute; top: 0; left: 0;
  width: 80px; height: 80px; opacity: 0.18; pointer-events: none;
  background:
    radial-gradient(circle at 12px 12px, rgba(153,98,55,0.6) 1px, transparent 1px),
    radial-gradient(circle at 22px 8px, rgba(153,98,55,0.5) 0.8px, transparent 0.8px),
    radial-gradient(circle at 8px 22px, rgba(153,98,55,0.5) 0.8px, transparent 0.8px),
    radial-gradient(circle at 30px 18px, rgba(153,98,55,0.4) 0.6px, transparent 0.6px),
    radial-gradient(circle at 18px 30px, rgba(153,98,55,0.4) 0.6px, transparent 0.6px);
  background-size: 50px 50px;
}

/* 右上角边角花纹 */
.htop-r {
  position: absolute; top: 0; right: 0;
  width: 80px; height: 80px; opacity: 0.18; pointer-events: none;
  background:
    radial-gradient(circle at 68px 12px, rgba(153,98,55,0.6) 1px, transparent 1px),
    radial-gradient(circle at 58px 8px, rgba(153,98,55,0.5) 0.8px, transparent 0.8px),
    radial-gradient(circle at 72px 22px, rgba(153,98,55,0.5) 0.8px, transparent 0.8px),
    radial-gradient(circle at 50px 18px, rgba(153,98,55,0.4) 0.6px, transparent 0.6px),
    radial-gradient(circle at 62px 30px, rgba(153,98,55,0.4) 0.6px, transparent 0.6px);
  background-size: 50px 50px;
}

.header-inner {
  position: relative; z-index: 2;
  max-width: 1400px; margin: 0 auto; padding: 0 28px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 150px; gap: 4px; text-align: center;
}
.header-left { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.header-icon {
  width: 48px; height: 48px; border-radius: 50%;
  background: rgba(255,255,255,0.15); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; flex-shrink: 0;
}
.header h1 {
  font-size: 1.5rem; font-weight: 700; letter-spacing: 0.05em;
  text-shadow: 0 2px 8px rgba(0,0,0,0.3);
}
.header .subtitle { font-size: 0.82rem; opacity: 0.7; font-weight: 400; text-shadow: 0 1px 4px rgba(0,0,0,0.2); }
.badge {
  background: rgba(255,255,255,0.12); backdrop-filter: blur(12px);
  padding: 8px 18px; border-radius: 24px; font-size: 0.76rem; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  border: 1px solid rgba(255,255,255,0.15);
}
.badge .dot { width: 9px; height: 9px; background: #7dff7d; border-radius: 50%; animation: pulse 2s infinite; box-shadow: 0 0 6px rgba(125,255,125,0.5); }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }

/* 小瓷瓶点缀 */
.hv1, .hv2, .hv3 { position: absolute; pointer-events: none; z-index: 1; }
.hv1 { left: 12%; top: 55%; opacity: 0.22; }
.hv2 { right: 15%; top: 50%; opacity: 0.18; }
.hv3 { left: 48%; top: 65%; opacity: 0.15; }
@media(max-width:900px){ .hv1,.hv2,.hv3 { display:none; } }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }

/* ===== Layout ===== */
.main { max-width: 1400px; margin: 0 auto; padding: 24px 28px; display: grid; grid-template-columns: 350px 1fr; gap: 24px; min-height: calc(100vh - 150px); }

/* ===== Sidebar ===== */
.sidebar { background: var(--ik-milk); border: 1px solid var(--ik-border); border-radius: var(--radius-lg); box-shadow: var(--shadow);
  overflow: hidden; display: flex; flex-direction: column; border: 1px solid var(--border);
}
.sidebar-header {
  padding: 18px 22px; border-bottom: 1px solid var(--border);
  font-weight: 700; font-size: 1rem; letter-spacing: 0.02em; display: flex; align-items: center; gap: 6px;
  background: var(--ik-milk);
  display: flex; align-items: center; gap: 8px;
}
.sidebar-header::before { content: none; font-size: 1.1rem; }
.process-list { flex: 1; overflow-y: auto; padding: 6px 0; }
.process-item {
  display: flex; align-items: center; gap: 12px;
  padding: 13px 22px; cursor: pointer; transition: all 0.2s ease;
  border-left: 4px solid transparent; position: relative; margin: 2px 0;
}
.process-item:hover { background: #fdfaf5; transform: translateX(2px); }
.process-item.active { background: var(--ik-sand); border-left: 3px solid var(--ik-brown); }
.process-num {
  width: 34px; height: 34px; border-radius: 50%;
  background: var(--clay-light); color: var(--clay-dark);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 0.85rem; flex-shrink: 0;
  transition: all 0.25s ease; box-shadow: 0 2px 6px rgba(198,123,75,0.15);
}
.process-item.active .process-num {
  background: linear-gradient(135deg, var(--clay), var(--clay-dark));
  color: #fff; box-shadow: 0 4px 12px rgba(198,123,75,0.35);
  transform: scale(1.08);
}
.process-info h4 { font-size: 0.9rem; line-height: 1.2; font-weight: 600; }
.process-info span { font-size: 0.7rem; color: var(--text-light); }
.stage-badge {
  margin-left: auto; padding: 3px 10px; border-radius: 12px;
  font-size: 0.66rem; font-weight: 600; letter-spacing: 0.02em;
}
.stage-1 { background: var(--ik-sand); color: var(--ik-brown); }
.stage-2 { background: var(--ik-sand); color: var(--ik-brown); }
.stage-3 { background: var(--ik-sand); color: var(--ik-brown); }

/* ===== Content ===== */
.content { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

/* ===== Chat Panel ===== */
.chat-panel { background: #fff; border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; flex: 1; min-height: 520px; border: 1px solid var(--ik-border); overflow: hidden; box-shadow: var(--shadow);
  display: flex; flex-direction: column; flex: 1; min-height: 520px;
  border: 1px solid var(--border); overflow: hidden;
}
.chat-header {
  padding: 16px 22px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
  background: var(--ik-milk);
}
.chat-header .icon { font-size: 1.4rem; }
.chat-header h3 { font-size: 0.95rem; font-weight: 700; }
.chat-messages {
  flex: 1; overflow-y: auto; padding: 20px 22px;
  display: flex; flex-direction: column; gap: 14px;
  background: var(--ik-bg);
}
.message { display: flex; gap: 10px; max-width: 88%; animation: msgIn 0.3s ease; }
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.message.user { align-self: flex-end; flex-direction: row-reverse; }
.message.assistant { align-self: flex-start; }
.message .avatar {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center; font-size: 0.82rem;
  font-weight: 700; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}
.message.user .avatar { background: linear-gradient(135deg, var(--clay), var(--clay-dark)); color: #fff; }
.message.assistant .avatar { background: linear-gradient(135deg, var(--glaze), #3d6a64); color: #fff; }
.message .bubble {
  padding: 12px 16px; border-radius: 18px; font-size: 0.88rem; line-height: 1.6;
  box-shadow: var(--shadow-sm); position: relative;
}
.message.user .bubble {
  background: linear-gradient(135deg, var(--clay), #b87040);
  color: #fff; border-bottom-right-radius: 6px;
}
.message.assistant .bubble {
  background: #f8f4ee; color: var(--text); border-bottom-left-radius: 6px;
  border: 1px solid #f0e8dc;
}
.message .bubble strong { color: var(--clay-dark); }
.message .bubble em { color: var(--glaze); font-style: normal; font-weight: 600; }

.quick-questions {
  display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 22px;
  border-top: 1px solid var(--border); background: #fefdfb;
}
.quick-q {
  padding: 7px 16px; border-radius: 20px; border: 1.5px solid var(--border);
  background: #fff; cursor: pointer; font-size: 0.8rem; transition: all 0.2s ease;
  white-space: nowrap; font-weight: 500;
}
.quick-q:hover {
  border-color: var(--clay); background: var(--clay-warm);
  color: var(--clay-dark); transform: translateY(-1px); box-shadow: 0 2px 8px rgba(198,123,75,0.12);
}
.quick-q:active { transform: scale(0.96); }

.chat-input-wrap {
  display: flex; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--border);
  background: #fff;
}
.chat-input-wrap input {
  flex: 1; padding: 11px 18px; border-radius: 26px; border: 2px solid var(--border);
  font-size: 0.9rem; outline: none; transition: all 0.25s ease; font-family: inherit;
  background: #fdfaf6;
}
.chat-input-wrap input:focus {
  border-color: var(--clay); background: #fff;
  box-shadow: 0 0 0 4px rgba(198,123,75,0.08);
}
.chat-input-wrap button {
  padding: 11px 26px; border-radius: 26px; border: none;
  background: linear-gradient(135deg, var(--clay), #b87040);
  color: #fff; font-weight: 700; cursor: pointer; font-size: 0.9rem;
  transition: all 0.25s ease; font-family: inherit; box-shadow: 0 4px 14px rgba(198,123,75,0.3);
  letter-spacing: 0.02em;
}
.chat-input-wrap button:hover {
  background: linear-gradient(135deg, var(--clay-dark), #7a3a15);
  box-shadow: 0 6px 20px rgba(139,69,19,0.4); transform: translateY(-1px);
}
.chat-input-wrap button:active { transform: scale(0.96); }

/* ===== Detail Card ===== */
.detail-card { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 24px; display: none; border: 1px solid var(--ik-border);
  animation: fadeSlide 0.35s ease;
}
@keyframes fadeSlide { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
.detail-card.visible { display: block; }
.detail-card h2 {
  font-size: 1.35rem; margin-bottom: 6px; display: flex; align-items: center; gap: 12px;
  font-weight: 700;
}
.detail-card .en {
  font-size: 0.82rem; color: var(--text-light); margin-bottom: 14px;
  font-style: italic; letter-spacing: 0.02em;
}
.detail-card .desc { font-size: 0.95rem; margin-bottom: 20px; color: var(--text-light); line-height: 1.7; }
.detail-section { margin-bottom: 20px; }
.detail-section h4 {
  font-size: 0.9rem; color: var(--clay-dark); margin-bottom: 10px;
  padding-bottom: 8px; border-bottom: 2px solid var(--clay-light);
  font-weight: 700; display: flex; align-items: center; gap: 6px;
}
.detail-section h4::before { content: ''; width: 4px; height: 16px; background: var(--clay); border-radius: 2px; display: inline-block; }
.technique-card {
  background: var(--ik-milk); border-radius: 6px; padding: 10px 12px;
  margin-bottom: 10px; border-left: 3px solid var(--ik-brown);
  transition: all 0.2s ease;
}
.technique-card:hover { border-left-color: var(--ik-brown); background: var(--ik-sand); }
.technique-card h5 { font-size: 0.88rem; margin-bottom: 4px; font-weight: 600; }
.technique-card p { font-size: 0.84rem; color: var(--text-light); }
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; }
.tag {
  display: inline-block; margin: 2px 4px 2px 0;
  padding: 6px 12px; border-radius: 8px; font-size: 0.76rem; font-weight: 500;
  transition: transform 0.15s ease;
}
.tag:hover { transform: translateY(-1px); }
.tag-point { background: var(--ik-sand); color: var(--ik-brown); }
.tag-method { background: var(--ik-sand); color: var(--ik-brown); }
.tag-warn { background: var(--ik-sand); color: var(--ik-brown); }
.tag-info { background: var(--ik-sand); color: var(--ik-brown); }

/* ===== Search ===== */
.search-wrap {
  padding: 14px 22px; border-bottom: 1px solid var(--ik-border);
  background: var(--ik-milk);
}
.search-wrap input {
  width: 100%; padding: 8px 16px; border-radius: 10px;
  border: 1px solid var(--ik-border); font-size: 0.86rem; height: 38px;
  outline: none; transition: all 0.25s ease; font-family: inherit;
  background: var(--ik-milk);
}
.search-wrap input:focus {
  border-color: var(--ik-brown); background: #fff;
  box-shadow: 0 0 0 3px rgba(153,98,55,0.08);
}

/* ===== Mobile toggle button ===== */
.mobile-sidebar-toggle {
  display: none; position: fixed; bottom: 24px; right: 24px; z-index: 200;
  width: 52px; height: 52px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, var(--clay), var(--clay-dark));
  color: #fff; font-size: 1.4rem; cursor: pointer;
  box-shadow: 0 6px 20px rgba(139,69,19,0.4);
  transition: all 0.25s ease; align-items: center; justify-content: center;
}
.mobile-sidebar-toggle:active { transform: scale(0.9); }

/* ===== Mobile Sidebar Overlay ===== */
.sidebar-overlay {
  display: none; position: fixed; inset: 0; z-index: 150;
  background: rgba(0,0,0,0.35); backdrop-filter: blur(2px);
}
.sidebar-overlay.open { display: block; }

/* ===== 陶瓷文化装饰 ===== */
/* 冰裂纹 header 装饰线 */
.header::before {
  content: ''; position: absolute; bottom: 2px; left: 0; right: 0; height: 4px;
  background: repeating-linear-gradient(90deg,
    transparent, transparent 6px,
    rgba(255,255,255,0.25) 6px, rgba(255,255,255,0.25) 7px,
    transparent 7px, transparent 12px,
    rgba(255,255,255,0.15) 12px, rgba(255,255,255,0.15) 14px
  );
  z-index: 1;
}

/* 侧边栏回纹顶边 */
.sidebar-header::after {
  content: ''; display: block; height: 3px; margin-top: 10px;
  background: repeating-linear-gradient(90deg,
    var(--clay) 0px, var(--clay) 12px,
    transparent 12px, transparent 16px,
    var(--clay) 16px, var(--clay) 24px,
    transparent 24px, transparent 28px
  );
  border-radius: 2px; opacity: 0.5;
}

/* ===== 五大名窑色卡画廊 ===== */
.kiln-gallery {
  padding: 12px 16px; border-bottom: 1px solid var(--border);
  background: var(--ik-milk);
}
.kiln-gallery .kg-title {
  font-size: 0.72rem; font-weight: 700; color: var(--clay-dark);
  margin-bottom: 8px; display: flex; align-items: center; gap: 5px;
}
.kiln-row {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.kiln-chip {
  flex: 1; min-width: 52px; text-align: center; cursor: pointer;
  padding: 8px 4px 6px; border-radius: 10px; background: #fff;
  border: 1px solid var(--border); transition: all 0.25s ease;
  position: relative; overflow: hidden;
}
.kiln-chip:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(61,50,38,0.1); }
.kiln-chip:active { transform: scale(0.94); }
.kiln-chip .glaze-swatch {
  width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
}
.kiln-chip .k-name {
  font-size: 0.65rem; font-weight: 600; color: var(--text);
}
.kiln-chip .k-era {
  font-size: 0.58rem; color: var(--text-light);
}
/* 五大名窑器物图标 */
.kiln-chip-new { flex: 1; min-width: 52px; text-align: center; cursor: pointer; padding: 8px 2px 6px; border-radius: 10px; background: transparent; border: none; transition: all 0.25s ease; }
.kiln-chip-new:hover { transform: translateY(-2px); }
.kiln-chip-new:hover .kiln-icon-circle { background: #F1E8DB; }
.kiln-chip-new:active { transform: scale(0.94); }
.kiln-icon-circle { width: 42px; height: 42px; border-radius: 50%; background: #F8F3E9; display: flex; align-items: center; justify-content: center; margin: 0 auto 3px; transition: background 0.2s ease; }
.kiln-chip-new .k-name { font-size: 0.65rem; font-weight: 600; color: var(--text); }
.kiln-chip-new .k-era { font-size: 0.58rem; color: var(--text-light); }
/* 删除旧色卡 */
.swatch-ru,.swatch-guan,.swatch-ge,.swatch-jun,.swatch-ding { display: none; }
.glaze-swatch { display: none; }
.kiln-chip { display: none; }

/* ===== 流程列表增强 ===== */
.process-item { position: relative; overflow: hidden; }
.process-item::after {
  content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  transition: left 0.5s ease;
}
.process-item:hover::after { left: 100%; }
.process-icon {
  font-size: 0.9rem; width: 20px; text-align: center; flex-shrink: 0;
}
.stage-badge { transition: all 0.25s ease; }
.stage-1 { background: linear-gradient(135deg, #faf0e6, #f5e0c8); color: #a07020; }
.stage-2 { background: linear-gradient(135deg, #e6f0f5, #d0e0f0); color: #1a608b; }
.stage-3 { background: linear-gradient(135deg, #efe6f5, #e0d0f0); color: #6b1a8b; }

/* ===== 统计仪表板 ===== */
.stats-dashboard {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  background: var(--ik-milk);
}
.stat-item {
  text-align: center; padding: 10px 4px; border-radius: 8px;
  background: var(--ik-milk); border: 1px solid var(--ik-border);
  transition: all 0.2s ease; cursor: default;
}
.stat-item:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
.stat-item .stat-num {
  font-size: 1.2rem; font-weight: 800; color: var(--ik-brown);
}
.stat-item .stat-label {
  font-size: 0.62rem; color: var(--text-light); margin-top: 2px;
}

/* ===== 工具箱 Widget ===== */
.toolbox-widget {
  background: var(--card); border-radius: var(--radius-lg); box-shadow: var(--shadow);
  border: 1px solid var(--border); overflow: hidden;
}
.toolbox-header { padding: 14px 20px; border-bottom: 1px solid var(--ik-border); font-weight: 700; font-size: 0.9rem; background: var(--ik-milk); display: flex; align-items: center; gap: 8px; }
.toolbox-grid {
  display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px;
  background: var(--ik-border);
}
.toolbox-col {
  background: #fff; padding: 14px 12px;
}
.toolbox-col h4 {
  font-size: 0.72rem; color: var(--clay-dark); margin-bottom: 8px;
  font-weight: 700; display: flex; align-items: center; gap: 4px;
}
.tb-stat-row {
  display: flex; justify-content: space-between; padding: 4px 0;
  font-size: 0.72rem; border-bottom: 1px dotted var(--border);
}
.tb-stat-row:last-child { border-bottom: none; }
.tb-stat-row .tb-val { font-weight: 700; color: var(--clay); }
.tb-hot-item {

// ==================== Init ====================
function init() {
  renderProcessList();
  renderKilnGallery();
  renderDetailCard(0);
  renderQuickQuestions(0);
  setActiveStep(0);
  renderKnowledgeBar();

  // Knowledge bar click to refresh
  document.getElementById('knowledgeBar').addEventListener('click', renderKnowledgeBar);

  // Render toolbox
  renderToolbox();

  // Bind chat input Enter key
  document.getElementById('chatInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendMessage();
  });
  // Bind send button
  document.getElementById('sendBtn').addEventListener('click', sendMessage);

  // Delegate process list clicks
  document.getElementById('processList').addEventListener('click', function(e) {
    const item = e.target.closest('.process-item');
    if (item) {
      const idx = parseInt(item.id.replace('processItem', ''));
      setActiveStep(idx);
    }
  });

  // Bind search
  document.getElementById('searchInput').addEventListener('input', function(e) {
    handleSearch(e.target.value);
  });
}

function renderProcessList() {
  const list = document.getElementById('processList');
  const stageLabels = {1: '段位一', 2: '段位二', 3: '段位三'};
  const stepIcons = ['knead','center','open','raise','shape','trim','dry','bisque','glaze','finish'];

  KB.categories.forEach((cat, i) => {
    if (i <= 4) cat.stage = 1;
    else if (i <= 6) cat.stage = 2;
    else cat.stage = 3;
  });

  list.innerHTML = KB.categories.map((cat, i) => `
    <div class="process-item" id="processItem${i}">
      <span class="process-icon">${iconSVG(stepIcons[i]||'menu',20)}</span>
      <div class="process-num">${i + 1}</div>
      <div class="process-info">
        <h4>${cat.name}</h4>
        <span>${cat.en}</span>
      </div>
      <span class="stage-badge stage-${cat.stage}">${stageLabels[cat.stage]}</span>
    </div>
  `).join('');
}

function setActiveStep(index, silent) {
  activeStep = index;
  var items = document.querySelectorAll('.process-item');
  for (var i = 0; i < items.length; i++) { items[i].classList.remove('active'); }
  var item = document.getElementById('processItem' + index);
  if (item) {
    item.classList.add('active');
    if (!silent) { item.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
  }
  renderDetailCard(index);
  renderQuickQuestions(index);
  // Keep chat panel visible after switching
  if (silent) { scrollToChat(); }
}

// ==================== Search ====================
function handleSearch(query) {
  if (!query.trim()) { setActiveStep(activeStep); return; }
  const q = query.toLowerCase();
  let found = -1;
  for (let i = 0; i < KB.categories.length; i++) {
    const c = KB.categories[i];
    const haystack = c.name + c.desc + c.en + c.qa.map(x => x.q + x.a).join(' ') +  c.points.join(' ') +  c.techniques.map(t => t.name + t.desc).join(' ');
    if (haystack.toLowerCase().includes(q)) { found = i; break; }
  }
  if (found >= 0) setActiveStep(found);
}

// ==================== Chat ====================
function addMessage(role, text) {
  chatHistory.push({ role, text });
  const msgs = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.innerHTML = `
    <div class="avatar">${role === 'user' ? '我' : 'AI'}</div>
    <div class="bubble">${text}</div>
  `;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;

function findBestAnswer(query) {
  const q = query.toLowerCase();
  let bestMatch = null;
  let bestScore = 0;

  // Search all QA pairs
  for (const c of KB.categories) {
    for (const qa of c.qa) {
      const score = matchScore(q, qa.q.toLowerCase());
      if (score > bestScore) { bestScore = score; bestMatch = { cat: c, qa }; }
    }
  }

  // If no good QA match, search in descriptions and keywords
  if (bestScore < 3) {
    for (const c of KB.categories) {
      const descScore = matchScore(q, (c.name + c.desc + c.points.join(' ')).toLowerCase());
      if (descScore > bestScore) {
        bestScore = descScore;
        bestMatch = { cat: c, qa: null, descMatch: true };
      }
    }
  }
  return bestMatch;
}

function matchScore(query, target) {
  let score = 0;
  // 1. Exact substring: the whole query or meaningful chunks
  if (target.includes(query)) { score += 20; return score; }
  // 2. Strip punctuation before ngram matching, also filter stop phrases
  const cleanQ = query.replace(/[？?！!，,。.、\s]+/g, '');
  const cleanT = target.replace(/[？?！!，,。.、\s]+/g, '');
  const stopGrams = new Set([
    '怎么办','是什么','为什么','有什么区别','要注意','有什么','怎么做',
    '如何','哪个','怎么','什么','应该','需要','的方法','的技巧',
    '要注意什么','有什么技巧','怎样','怎么样','在哪','哪里','哪个','哪些'
  ]);
  for (let len = 5; len >= 2; len--) {
    for (let i = 0; i <= cleanQ.length - len; i++) {
      const ng = cleanQ.slice(i, i + len);
      if (stopGrams.has(ng)) continue;
      if (cleanT.includes(ng)) score += len * 1.5;
    }
  }
  // 3. CJK character overlap (boosted — carries domain meaning)
  const cjkQ = cleanQ.replace(/[^一-鿿]/g, '');
  const cjkT = cleanT.replace(/[^一-鿿]/g, '');
  if (cjkQ.length > 1) {
    let charHits = 0;
    for (const ch of cjkQ) {
      if (cjkT.includes(ch)) charHits++;
    }
    score += charHits * 1.2; // heavy boost for domain character overlap
  }
  return score;
}

function generateAnswer(query) {
  const result = findBestAnswer(query);
  if (!result) {
    return `抱歉，我在知识库中没有找到关于"${query}"的匹配信息。请尝试以下方式：<br><br>
    <strong>1.</strong> 使用更简洁的关键词（如：揉泥、修坯、上釉）<br>
    <strong>2.</strong> 点击左侧流程导航查看各环节详情<br>
    <strong>3.</strong> 点击下方推荐问题快速提问`;
  }

  if (result.qa) {
    // Direct QA match — silent to avoid sidebar scroll
    setActiveStep(KB.categories.indexOf(result.cat), true);
    return `<strong>【${result.cat.name}】</strong><br><br>${result.qa.a}<br><br><em>相关知识点已在右侧面板显示。</em>`;
  }

  // Description match — silent to avoid sidebar scroll
  setActiveStep(KB.categories.indexOf(result.cat), true);
  let ans = `<strong>【${result.cat.name}】</strong><br><br>${result.cat.desc}<br><br><strong>相关要点：</strong><br>`;
  result.cat.points.forEach(p => ans += `· ${p}<br>`);
  if (result.cat.qa.length > 0) {
    ans += `<br><em>该环节还有 ${result.cat.qa.length} 个常见问答，可在推荐问题中查看。</em>`;
  }
  return ans;
}

function scrollToChat() {
  var chatPanel = document.querySelector('.chat-panel');
  if (!chatPanel) return;
  var rect = chatPanel.getBoundingClientRect();
  // If chat panel is not fully visible, scroll it into view
  if (rect.bottom > window.innerHeight || rect.top < 0) {
    chatPanel.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
  // Also scroll chat messages to latest
  var msgs = document.getElementById('chatMessages');
  if (msgs) { msgs.scrollTop = msgs.scrollHeight; }
}

function sendMessage() {
  var input = document.getElementById('chatInput');
  var query = input.value.trim();
  if (!query) return;
  addMessage('user', query);
  input.value = '';
  setTimeout(function() {
    var answer = generateAnswer(query);
    addMessage('assistant', answer);
    scrollToChat();
  }, 350);
}

function sendQuick(q) {
  addMessage('user', q);
  setTimeout(function() {
    var answer = generateAnswer(q);
    addMessage('assistant', answer);
    scrollToChat();
  }, 350);
}
