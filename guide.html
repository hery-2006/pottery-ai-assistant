<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>陶艺拉坯入门 — AI分步指导</title>
<style>
:root {
  --clay:#c67b4b; --clay-dark:#8b4513; --clay-light:#faf0e6;
  --glaze:#5b8c85; --fire:#d4534a; --safe:#4caf50;
  --bg:#fdfaf6; --card:#fff; --text:#3d3226; --text-light:#7a6f64;
  --border:#e8ddd0; --shadow:0 4px 16px rgba(61,50,38,0.07),0 1px 4px rgba(61,50,38,0.04);
  --shadow-lg:0 8px 32px rgba(61,50,38,0.1),0 2px 8px rgba(61,50,38,0.05);
  --radius:14px; --radius-lg:20px; --safe-bottom:env(safe-area-inset-bottom,16px);
  --ai-bg:#1a1410; --ai-surface:#2a2018; --ai-accent:#6366f1;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{height:100%;overflow:hidden;}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f0ea;color:var(--text);height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;}

.header{background:linear-gradient(135deg,#4a2a10,#7a4a24,#9a6a44);color:#fff;padding:12px 16px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 16px rgba(0,0,0,0.18);z-index:10;}
.header h1{font-size:1.05rem;font-weight:700;letter-spacing:0.02em;}
.clay-badge{background:rgba(255,255,255,0.12);backdrop-filter:blur(8px);padding:6px 14px;border-radius:16px;font-size:0.75rem;cursor:pointer;font-weight:500;border:1px solid rgba(255,255,255,0.12);transition:all 0.2s ease;}
.clay-badge:active{background:rgba(255,255,255,0.22);transform:scale(0.96);}

.progress-wrap{padding:12px 16px 6px;background:var(--card);flex-shrink:0;}
.progress-text{display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-light);margin-bottom:8px;}
.progress-text .step-name{font-weight:700;color:var(--clay-dark);font-size:1rem;}
.progress-bar{display:flex;gap:6px;}
.progress-dot{flex:1;height:6px;border-radius:3px;background:#e8ddd0;transition:all 0.3s ease;cursor:pointer;}
.progress-dot.done{background:var(--safe);box-shadow:0 0 6px rgba(76,175,80,0.3);}
.progress-dot.active{background:linear-gradient(90deg,var(--clay),var(--clay-dark));box-shadow:0 0 8px rgba(198,123,75,0.4);}

.main-content{flex:1;overflow:hidden;position:relative;}
.steps-container{display:flex;height:100%;transition:transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94);will-change:transform;}
.step-slide{min-width:100%;height:100%;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;}

.step-card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:24px 20px;margin-bottom:14px;border:1px solid var(--border);}
.step-card .step-icon{font-size:3rem;text-align:center;margin-bottom:6px;display:block;}
.step-card h2{font-size:1.35rem;text-align:center;margin-bottom:4px;font-weight:700;}
.step-card .tagline{text-align:center;color:var(--text-light);font-size:0.85rem;margin-bottom:18px;}

.ai-guide-btn{display:block;width:100%;padding:15px;margin:14px 0;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:14px;font-size:1.05rem;font-weight:700;cursor:pointer;font-family:inherit;box-shadow:0 6px 20px rgba(99,102,241,0.35);transition:all 0.2s ease;letter-spacing:0.02em;}
.ai-guide-btn:active{transform:scale(0.96);box-shadow:0 3px 10px rgba(99,102,241,0.2);}

.instruction-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);align-items:flex-start;position:relative;}
.instruction-item:last-child{border-bottom:none;}
.instruction-item::before{content:'';position:absolute;left:13px;top:42px;bottom:-14px;width:2px;background:var(--clay-light);}
.instruction-item:last-child::before{display:none;}
.instruction-num{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--clay),var(--clay-dark));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.8rem;flex-shrink:0;box-shadow:0 2px 8px rgba(198,123,75,0.3);}
.instruction-text h4{font-size:0.92rem;margin-bottom:3px;font-weight:600;}
.instruction-text p{font-size:0.82rem;color:var(--text-light);line-height:1.5;}

.warning-box{background:#fffdf5;border-radius:12px;padding:14px 16px;margin-top:16px;border-left:4px solid #ff9800;box-shadow:0 2px 8px rgba(255,152,0,0.08);}
.warning-box h5{font-size:0.82rem;color:#e65100;margin-bottom:6px;font-weight:700;}
.warning-box ul{list-style:none;padding:0;}
.warning-box li{font-size:0.8rem;color:#8d6e00;padding:3px 0;line-height:1.5;}
.warning-box li::before{content:"⚠️ ";}

.complete-btn{display:block;width:100%;margin-top:16px;padding:15px;background:var(--safe);color:#fff;border:none;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.2s ease;font-family:inherit;box-shadow:0 4px 14px rgba(76,175,80,0.3);letter-spacing:0.02em;}
.complete-btn:active{transform:scale(0.96);}
.complete-btn.done{background:#c0c0c0;box-shadow:none;}

.equip-bar{background:var(--card);margin:0 16px 10px;border-radius:var(--radius);padding:12px 14px;display:flex;gap:10px;justify-content:space-around;flex-shrink:0;box-shadow:var(--shadow);cursor:pointer;font-size:0.75rem;border:1px solid var(--border);transition:all 0.2s ease;}
.equip-bar:active{transform:scale(0.98);}
.equip-item{text-align:center;}
.equip-item .val{font-weight:700;color:var(--clay-dark);font-size:0.88rem;}
.equip-item .lbl{font-size:0.7rem;color:var(--text-light);}

.nav-bar{display:flex;background:var(--card);border-top:1px solid var(--border);padding:10px 0 calc(10px + var(--safe-bottom));flex-shrink:0;box-shadow:0 -2px 12px rgba(61,50,38,0.04);}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:6px 0;transition:all 0.2s ease;font-size:0.7rem;color:var(--text-light);}
.nav-item:active{transform:scale(0.9);color:var(--clay-dark);}
.nav-item .nav-icon{font-size:1.4rem;}

.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:200;display:none;justify-content:center;align-items:flex-end;backdrop-filter:blur(2px);}
.sheet-overlay.open{display:flex;}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;max-height:78vh;overflow-y:auto;padding:20px 20px 28px;animation:slideUp 0.3s cubic-bezier(0.32,0.72,0,1);box-shadow:0 -8px 32px rgba(0,0,0,0.15);}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheet-handle{width:40px;height:5px;background:#d0c8bc;border-radius:3px;margin:0 auto 16px;}
.sheet h3{font-size:1.1rem;margin-bottom:16px;text-align:center;font-weight:700;}

.clay-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.clay-card{background:#fdfaf5;border-radius:14px;padding:16px 14px;text-align:center;border:2.5px solid transparent;cursor:pointer;transition:all 0.25s ease;}
.clay-card:active{transform:scale(0.95);}
.clay-card.selected{border-color:var(--clay);background:var(--clay-light);box-shadow:0 4px 16px rgba(198,123,75,0.2);}
.clay-card .emoji{font-size:2.2rem;display:block;margin-bottom:4px;}
.clay-card h4{font-size:0.92rem;margin:6px 0;font-weight:700;}
.clay-card .stars{color:#ff9800;font-size:0.78rem;}
.clay-card .rec{font-size:0.72rem;color:var(--text-light);margin-top:4px;line-height:1.4;}

.error-search{width:100%;padding:11px 16px;border-radius:24px;border:2px solid var(--border);font-size:0.9rem;outline:none;font-family:inherit;margin-bottom:14px;background:#fdfaf6;transition:all 0.25s ease;}
.error-search:focus{border-color:var(--clay);box-shadow:0 0 0 4px rgba(198,123,75,0.08);}
.error-list{display:flex;flex-direction:column;gap:8px;}
.error-chip{padding:12px 14px;border-radius:12px;border:1px solid var(--border);cursor:pointer;font-size:0.84rem;background:#fff;transition:all 0.2s ease;}
.error-chip:active{background:var(--clay-light);border-color:var(--clay);transform:scale(0.98);}
.sev{font-size:0.7rem;padding:3px 8px;border-radius:6px;margin-left:8px;font-weight:600;}
.sev-critical{background:#fce4ec;color:#c62828;}
.sev-high{background:#fff3e0;color:#e65100;}
.sev-medium{background:#fff8e1;color:#f57f17;}

.error-result{display:none;}
.error-result.visible{display:block;animation:fadeSlide 0.3s ease;}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.back-btn{font-size:0.88rem;color:var(--clay);cursor:pointer;margin-bottom:14px;display:inline-flex;align-items:center;gap:4px;font-weight:600;transition:opacity 0.2s ease;}
.back-btn:active{opacity:0.6;}
.correction-step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:0.86rem;align-items:flex-start;line-height:1.5;}
.correction-step .num{background:linear-gradient(135deg,var(--fire),#c04040);color:#fff;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.76rem;font-weight:700;flex-shrink:0;box-shadow:0 2px 8px rgba(212,83,74,0.3);}

.pip-container{display:none;position:fixed;bottom:90px;right:16px;z-index:300;}
.pip-container.open{display:block;}
.pip-mini{width:84px;height:64px;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,0.35);background:linear-gradient(135deg,#4a2a10,#7a4a24);display:flex;align-items:center;justify-content:center;font-size:0.72rem;color:#f0e6d8;font-weight:600;transition:transform 0.2s ease;border:2px solid rgba(255,255,255,0.2);}
.pip-mini:active{transform:scale(0.92);}
.pip-full{display:none;position:fixed;inset:0;z-index:310;background:#000;}
.pip-full.open{display:flex;flex-direction:column;}
.pip-bar{padding:12px 16px;background:#2a2018;color:#f0e6d8;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.pip-bar button{background:linear-gradient(135deg,var(--fire),#c04040);color:#fff;border:none;padding:9px 18px;border-radius:10px;font-size:0.85rem;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 3px 10px rgba(212,83,74,0.3);}
.pip-full iframe{flex:1;border:none;}

/* ===== AI TUTOR OVERLAY ===== */
.ai-tutor-overlay{display:none;position:fixed;inset:0;z-index:500;background:var(--ai-bg);flex-direction:column;}
.ai-tutor-overlay.open{display:flex;}
.ai-tutor-topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:rgba(42,32,24,0.85);backdrop-filter:blur(12px);color:#f0e6d8;flex-shrink:0;font-size:0.82rem;font-weight:600;gap:8px;border-bottom:1px solid rgba(255,255,255,0.06);}
.ai-tutor-topbar .live-dot{width:10px;height:10px;background:#ff4444;border-radius:50%;animation:pulse 1.5s infinite;display:inline-block;margin-right:5px;box-shadow:0 0 8px rgba(255,68,68,0.5);}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.3;transform:scale(0.8);}}
.ai-tutor-topbar button{background:rgba(255,255,255,0.1);color:#f0e6d8;border:none;padding:6px 14px;border-radius:8px;font-size:0.74rem;cursor:pointer;font-family:inherit;transition:all 0.2s ease;border:1px solid rgba(255,255,255,0.08);}
.ai-tutor-topbar button:active{background:rgba(255,255,255,0.2);}

.ai-tutor-main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;}
.ai-self-view{flex:1;position:relative;background:#000;display:flex;align-items:center;justify-content:center;min-height:0;}
.ai-self-view video{width:100%;height:100%;object-fit:cover;}
.ai-self-view .no-camera{color:#aaa;text-align:center;padding:20px;font-size:0.88rem;}
.ai-ref-inset{position:absolute;bottom:12px;right:12px;width:115px;height:85px;border-radius:12px;overflow:hidden;border:2.5px solid rgba(255,255,255,0.5);background:var(--ai-surface);display:none;box-shadow:0 4px 16px rgba(0,0,0,0.4);}
.ai-ref-inset.show{display:block;}
.ai-ref-inset video{width:100%;height:100%;object-fit:cover;}

/* AI Chat-like feedback area */
.ai-chat-area{flex-shrink:0;max-height:30vh;overflow-y:auto;padding:10px 14px;background:var(--ai-surface);display:flex;flex-direction:column;gap:8px;}
.ai-chat-msg{display:flex;gap:8px;font-size:0.84rem;color:#f0e6d8;line-height:1.55;animation:msgSlide 0.25s ease;}
@keyframes msgSlide{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.ai-chat-msg .dot{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--ai-accent),#818cf8);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:0.65rem;box-shadow:0 2px 8px rgba(99,102,241,0.4);}
.ai-chat-msg .txt{background:rgba(255,255,255,0.06);padding:9px 14px;border-radius:0 14px 14px 14px;max-width:88%;border:1px solid rgba(255,255,255,0.05);}
.ai-chat-msg.user{flex-direction:row-reverse;}
.ai-chat-msg.user .txt{background:linear-gradient(135deg,var(--ai-accent),#7c3aed);border-radius:14px 0 14px 14px;border:none;}

/* Step instructions panel */
.ai-step-panel{background:var(--ai-surface);color:#f0e6d8;padding:12px 14px;flex-shrink:0;display:flex;gap:8px;align-items:center;overflow-x:auto;}
.ai-step-panel .sub-step{flex-shrink:0;text-align:center;padding:9px 12px;border-radius:12px;background:rgba(255,255,255,0.04);font-size:0.72rem;cursor:pointer;min-width:72px;border:1.5px solid transparent;transition:all 0.25s ease;}
.ai-step-panel .sub-step.active{border-color:var(--ai-accent);background:rgba(99,102,241,0.2);box-shadow:0 0 12px rgba(99,102,241,0.2);}
.ai-step-panel .sub-step.done{background:rgba(76,175,80,0.18);border-color:var(--safe);}
.ai-step-panel .sub-step .num{font-size:0.9rem;font-weight:700;}

/* Voice selector */
.voice-selector{display:flex;gap:8px;padding:10px 14px;background:var(--ai-surface);flex-shrink:0;overflow-x:auto;align-items:center;}
.voice-selector span{font-size:0.72rem;color:#a09080;flex-shrink:0;}
.voice-opt{padding:5px 12px;border-radius:14px;background:rgba(255,255,255,0.05);color:#c0b0a0;font-size:0.7rem;cursor:pointer;flex-shrink:0;border:1px solid transparent;white-space:nowrap;transition:all 0.2s ease;}
.voice-opt.selected{background:rgba(99,102,241,0.25);border-color:var(--ai-accent);color:#fff;}
.voice-opt:active{background:rgba(255,255,255,0.12);}

/* Controls */
.ai-controls{display:flex;gap:8px;padding:12px 14px;background:var(--ai-surface);flex-shrink:0;}
.ai-controls button{flex:1;padding:11px;border-radius:12px;border:none;font-size:0.8rem;font-weight:700;cursor:pointer;font-family:inherit;transition:all 0.2s ease;letter-spacing:0.02em;}
.ai-controls button:active{transform:scale(0.95);}
.btn-voice2{background:linear-gradient(135deg,var(--glaze),#4a7a74);color:#fff;box-shadow:0 3px 12px rgba(91,140,133,0.3);}
.btn-voice2.active{background:linear-gradient(135deg,var(--fire),#b84040);box-shadow:0 3px 12px rgba(212,83,74,0.4);}
.btn-check2{background:linear-gradient(135deg,var(--ai-accent),#7c3aed);color:#fff;box-shadow:0 3px 12px rgba(99,102,241,0.35);}
.btn-done2{background:linear-gradient(135deg,var(--safe),#3d9140);color:#fff;box-shadow:0 3px 12px rgba(76,175,80,0.35);}

/* Voice status indicator */
.voice-status{display:none;padding:8px 14px;background:var(--ai-surface);color:#ff9800;font-size:0.76rem;text-align:center;flex-shrink:0;font-weight:500;}
.voice-status.show{display:block;}
.voice-status.listening{color:#ff4444;}
.voice-status.processing{color:#ff9800;}

/* Quick chat input */
.quick-input-wrap{display:flex;gap:8px;padding:10px 14px;background:var(--ai-surface);flex-shrink:0;}
.quick-input-wrap input{flex:1;padding:10px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#f0e6d8;font-size:0.82rem;outline:none;font-family:inherit;transition:all 0.25s ease;}
.quick-input-wrap input:focus{border-color:var(--ai-accent);box-shadow:0 0 0 3px rgba(99,102,241,0.15);}
.quick-input-wrap button{padding:10px 16px;border-radius:20px;background:linear-gradient(135deg,var(--ai-accent),#818cf8);color:#fff;border:none;font-size:0.8rem;font-weight:600;cursor:pointer;font-family:inherit;box-shadow:0 2px 10px rgba(99,102,241,0.3);}

/* Quick replies */
.quick-replies{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;background:var(--ai-surface);flex-shrink:0;}
.quick-reply{padding:7px 14px;border-radius:16px;background:rgba(255,255,255,0.06);color:#c0b0a0;font-size:0.74rem;cursor:pointer;border:1px solid rgba(255,255,255,0.08);white-space:nowrap;transition:all 0.2s ease;}
.quick-reply:active{background:rgba(99,102,241,0.25);border-color:var(--ai-accent);color:#fff;transform:scale(0.96);}

/* Rating buttons */
.rate-btns{display:flex;gap:6px;padding:10px 14px;background:var(--ai-surface);flex-shrink:0;}
.rate-btns span{font-size:0.72rem;color:#a09080;flex-shrink:0;align-self:center;}

/* Check overlay */
.check-overlay{display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,0.7);justify-content:center;align-items:center;backdrop-filter:blur(3px);}
.check-overlay.open{display:flex;}
.check-card{background:var(--card);border-radius:18px;padding:28px 24px;width:90%;max-width:360px;text-align:center;box-shadow:0 16px 48px rgba(0,0,0,0.25);}
.check-card h4{font-size:1.05rem;margin-bottom:10px;font-weight:700;}
.check-card p{font-size:0.88rem;color:var(--text-light);margin-bottom:16px;line-height:1.5;}
.check-options{display:flex;flex-direction:column;gap:10px;}
.check-opt{padding:14px;border-radius:12px;border:2px solid var(--border);cursor:pointer;font-size:0.88rem;transition:all 0.2s ease;font-weight:500;}
.check-opt:active{background:var(--clay-light);border-color:var(--clay);transform:scale(0.97);}
.check-opt.good{border-color:var(--safe);background:#e8f5e9;}
.check-opt.bad{border-color:var(--fire);background:#fce4ec;}

.tts-btn{position:fixed;bottom:100px;left:16px;width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,var(--glaze),#4a7a74);color:#fff;border:none;font-size:1.2rem;cursor:pointer;z-index:150;box-shadow:0 4px 16px rgba(0,0,0,0.2);display:flex;align-items:center;justify-content:center;transition:all 0.25s ease;}
.tts-btn:active{transform:scale(0.9);}
.tts-btn.playing{background:linear-gradient(135deg,var(--fire),#b84040);animation:pulse 1.5s infinite;box-shadow:0 4px 16px rgba(212,83,74,0.4);}

.ip-banner{background:#e9f1fd;color:#1565c0;text-align:center;padding:8px;font-size:0.74rem;flex-shrink:0;cursor:pointer;font-weight:500;border-bottom:1px solid #d0e0f5;transition:background 0.2s ease;}
.ip-banner:active{background:#d0e0f5;}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(42,32,24,0.92);backdrop-filter:blur(12px);color:#f0e6d8;padding:12px 24px;border-radius:28px;font-size:0.85rem;z-index:999;opacity:0;transition:all 0.3s ease;pointer-events:none;box-shadow:0 8px 32px rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.08);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

/* ===== 桌面端响应式 ===== */
@media(min-width:768px){
  html{background:#e8e2d9;}
  body{max-width:720px;margin:0 auto;border-left:1px solid var(--border);border-right:1px solid var(--border);box-shadow:0 0 48px rgba(61,50,38,0.1);}
  .header{padding:14px 24px;}
  .header h1{font-size:1.2rem;}
  .progress-wrap{padding:14px 24px 8px;}
  .progress-text{font-size:0.85rem;}
  .progress-text .step-name{font-size:1.1rem;}
  .progress-dot{height:8px;}
  .step-slide{padding:20px 24px;}
  .step-card{padding:32px 28px;margin-bottom:20px;}
  .step-card h2{font-size:1.5rem;}
  .step-card .tagline{font-size:0.92rem;}
  .ai-guide-btn{font-size:1.1rem;padding:17px;margin:18px 0;}
  .instruction-text h4{font-size:0.98rem;}
  .instruction-text p{font-size:0.88rem;}
  .instruction-num{width:34px;height:34px;font-size:0.88rem;}
  .equip-bar{font-size:0.82rem;margin:0 24px 12px;}
  .equip-item .val{font-size:0.95rem;}
  .equip-item .lbl{font-size:0.75rem;}
  .nav-bar{padding:12px 0 calc(12px + var(--safe-bottom));}

.hero-stat {

}
.hero-stat .hs-num { font-size: 1.4rem; font-weight: 800; }
.hero-stat .hs-lbl { font-size: 0.65rem; color: var(--text-light); margin-top: 2px; }
.hero-stat.hs-clay .hs-num { color: var(--clay); }
.hero-stat.hs-done .hs-num { color: var(--safe); }

/* ===== 步骤手风琴 ===== */
.accordion-section { margin: 12px 0; }
.accordion-toggle {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 12px 14px; background: #fdfaf5; border: 1px solid var(--border);
  border-radius: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 700;
  font-family: inherit; color: var(--text); transition: all 0.2s ease;
}
.accordion-toggle:hover { background: var(--clay-warm); }
.accordion-toggle .acc-arrow {
  transition: transform 0.3s ease; font-size: 0.7rem; color: var(--text-light);
}
.accordion-toggle.open .acc-arrow { transform: rotate(180deg); }
.accordion-body {
  max-height: 0; overflow: hidden; transition: max-height 0.35s ease;
  border: 0 solid var(--border); border-radius: 0 0 10px 10px;
}
.accordion-body.open {
  max-height: 500px; border-width: 0 1px 1px 1px;
  padding: 0 14px; background: #fefdfb;
}

/* ===== 注意事项色块 ===== */
.warning-chips {
  display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
}
.warning-chip {
  padding: 6px 12px; border-radius: 8px; font-size: 0.74rem; font-weight: 600;
}
.wc-safety { background: #fce4ec; color: #c62828; }
.wc-technique { background: #fff3e0; color: #e65100; }

.ai-placeholder-art {

}
.ai-placeholder-art .apa-circles {
  position: relative; width: 120px; height: 120px;
}
.ai-placeholder-art .apa-c {
  position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,0.08);
}
.apa-c1 { inset: 0; animation: apaSpin 20s linear infinite; }
.apa-c2 { inset: 15px; animation: apaSpin 15s linear infinite reverse; }
.apa-c3 { inset: 30px; animation: apaSpin 10s linear infinite; }
.apa-c4 { inset: 45px; width: 30px; height: 30px; border-radius: 50%;
  background: rgba(198,123,75,0.2); margin: auto; }
@keyframes apaSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.ai-placeholder-art .apa-text {
  color: rgba(255,255,255,0.2); font-size: 0.85rem; margin-top: 16px;
  letter-spacing: 0.05em;
}

/* ===== 快捷回复网格 ===== */
.quick-replies { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

/* ===== 步骤卡片增强 ===== */
.step-card .vessel-art { margin-bottom: 8px; }
.vessel-art {
  width: 80px; height: 100px; margin: 0 auto 12px; position: relative;
}
.vessel-art::before {
  content: ''; position: absolute; inset: 0; border: 3px solid var(--clay);
  opacity: 0.3; background: linear-gradient(180deg, rgba(198,123,75,0.08), rgba(198,123,75,0.15));
}
/* 揉泥-球 */
.va-ball::before { border-radius: 50%; width: 60px; height: 60px; top: 20px; left: 10px; inset: auto; }
/* 定中心-圆锥 */
.va-cone::before { border-radius: 50% 50% 0 0 / 20% 20% 0 0; width: 60px; height: 70px; top: 15px; left: 10px; inset: auto; }
/* 开孔-凹陷 */
.va-opening::before { border-radius: 40% 40% 0 0 / 60% 60% 0 0; width: 55px; height: 60px; top: 20px; left: 12px; inset: auto; }
.va-opening::after { content: ''; position: absolute; width: 20px; height: 30px; border-radius: 50%; border: 3px solid var(--clay); opacity: 0.25; top: 25px; left: 30px; }
/* 拉高-直筒 */
.va-cylinder::before { border-radius: 5px 5px 0 0; width: 45px; height: 75px; top: 12px; left: 17px; inset: auto; }
/* 造型-花瓶 */
.va-vase::before {
  width: 50px; height: 80px; top: 10px; left: 15px; inset: auto;
  border-radius: 45% 45% 30% 30% / 20% 20% 50% 50%;
}
/* 修坯-碗 */
.va-bowl::before {
  width: 65px; height: 55px; top: 25px; left: 7px; inset: auto;
  border-radius: 0 0 50% 50% / 0 0 100% 100%;
}
/* 干燥-器型轮廓 */
.va-drying::before {
  width: 50px; height: 70px; top: 15px; left: 15px; inset: auto;
  border-radius: 40% 40% 25% 25% / 15% 15% 45% 45%;
}
/* 素烧-火焰 */
.va-fire::before {
  width: 45px; height: 60px; top: 20px; left: 17px; inset: auto;
  border-radius: 30% 30% 45% 45% / 25% 25% 60% 60%;
  border-color: var(--fire);
}
/* 上釉-笔刷覆盖 */
.va-glaze::before {
  width: 50px; height: 65px; top: 18px; left: 15px; inset: auto;
  border-radius: 38% 38% 28% 28% / 18% 18% 48% 48%;
  border-style: dashed; border-color: var(--glaze);
}
/* 釉烧-成品 */
.va-finish::before {
  width: 45px; height: 70px; top: 15px; left: 17px; inset: auto;
  border-radius: 42% 42% 30% 30% / 18% 18% 42% 42%;
  background: linear-gradient(180deg, rgba(198,123,75,0.15), rgba(212,83,74,0.12), rgba(91,140,133,0.2));
  border-color: var(--clay-dark);
}
.vessel-label {
  text-align: center; font-size: 0.6rem; color: var(--text-light);
  margin-top: -8px; font-style: italic;
}

/* ===== 进度增强 ===== */

}
.progress-dot.active {

}
@keyframes breathe {
  0%,100% { box-shadow: 0 0 6px rgba(198,123,75,0.3); }
  50% { box-shadow: 0 0 16px rgba(198,123,75,0.6); }
}
.progress-dot.done {

}
@keyframes popIn {
  0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1); }
}

function renderEquip(){

  const eq=EMBEDDED.equipment[idx-1];if(!eq)return;
  const clay=S.clay?EMBEDDED.clayTypes.find(c=>c.id===S.clay):null;
  const m=clay?clay.wheel_behavior.recommended_rpm_modifier:1;
  document.getElementById('eqRPM').textContent=eq.rpm?Math.round(eq.rpm[0]*m)+'-'+Math.round(eq.rpm[1]*m)+' RPM':'N/A';
  document.getElementById('eqWater').textContent=eq.water||'N/A';
  document.getElementById('eqTool').textContent=eq.tools&&eq.tools.length?eq.tools[0]:'无需';
  document.getElementById('eqTime').textContent=eq.time||'N/A';
}

// ============ ERRORS ============
function searchErrors(){
  const q=document.getElementById('errorSearch').value.toLowerCase().trim();
  if(!q){renderErrorList();return;}
  const scored=EMBEDDED.errors.map(e=>{let s=0;for(const kw of e.kw){if(q.includes(kw))s+=kw.length*2;if(kw.includes(q))s+=q.length;}if(e.s.toLowerCase().includes(q))s+=5;return{error:e,score:s};}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
  document.getElementById('errorList').innerHTML=scored.length===0?'<p style="text-align:center;color:var(--text-light);padding:20px">未找到匹配，请尝试其他关键词</p>':scored.map(s=>'<div class="error-chip" onclick="showErrorDetail(\''+s.error.id+'\')">'+s.error.s+'<span style="color:var(--text-light);font-size:0.72rem"> 匹配'+Math.min(100,s.score*5)+'%</span><span class="sev sev-'+s.error.sev+'">'+(s.error.sev==='critical'?'严重':s.error.sev==='high'?'高':'中')+'</span></div>').join('');
}
function showErrorDetail(id){
  const e=EMBEDDED.errors.find(x=>x.id===id);if(!e)return;
  document.getElementById('helpList').style.display='none';document.getElementById('errorResult').classList.add('visible');
  let h='<h3 style="color:var(--fire)">'+e.s+'</h3>';
  h+='<p style="font-size:0.85rem;margin:8px 0">严重程度：<span class="sev sev-'+e.sev+'">'+(e.sev==='critical'?'严重':e.sev==='high'?'高':'中')+'</span></p>';
  h+='<p style="font-size:0.85rem;color:var(--fire);margin:8px 0">⏱ '+e.ia+'</p><h4 style="margin:8px 0">📋 '+e.cr.t+'</h4>';
  e.cr.st.forEach((s,i)=>{h+='<div class="correction-step"><div class="num">'+(i+1)+'</div><div>'+s+'</div></div>';});

async function openAITutor(stepIdx){
  S.ao=true;S.cs=stepIdx+1;S.curSub=0;

  updateAITutor();
  // Camera
  try{
    if(!S.stream){S.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:640},height:{ideal:480}},audio:false});}
    const v=document.getElementById('aiSelfVid');v.srcObject=S.stream;v.style.display='block';
    document.getElementById('noCam').style.display='none';
    document.getElementById('aiPlaceholder').style.display='none';
  }catch(e){
    document.getElementById('noCam').style.display='block';
    document.getElementById('aiSelfVid').style.display='none';
    document.getElementById('aiPlaceholder').style.display='flex';
  }
  // Load voices
  await loadVoices();

  if(step.video){const rv=document.getElementById('aiRefVid');rv.src=step.video;rv.play().catch(()=>{});document.getElementById('aiRefInset').classList.add('show');}
  else{document.getElementById('aiRefInset').classList.remove('show');}

  aiChat('<i class="ri-robot-line" style="font-size:14px;vertical-align:-0.15em"></i>','你好！我是你的AI陶艺导师。我们开始<strong>'+step.name+'</strong>的训练吧。我会一步步指导你，过程中随时问我问题。准备好了吗？');

function closeAITutor(){S.ao=false;stopAIVoice();document.getElementById('aiTutor').classList.remove('open');}

function jumpToSub(i){S.curSub=i;updateAITutor();const s=EMBEDDED.steps[S.cs-1];aiChat('<i class="ri-robot-line" style="font-size:14px;vertical-align:-0.15em"></i>','我们来看第'+(i+1)+'步：<strong>'+s.subs[i].a+'</strong>。'+s.subs[i].d);speak(s.subs[i].a+'。'+s.subs[i].d);}

function aiChat(icon,msg){

// ============ VOICE SYSTEM ============
async function loadVoices(){
  return new Promise(resolve=>{
    const v=window.speechSynthesis.getVoices();
    if(v.length){S.availVoices=v;resolve(v);return;}
    window.speechSynthesis.onvoiceschanged=()=>{S.availVoices=window.speechSynthesis.getVoices();resolve(S.availVoices);};
    setTimeout(()=>{S.availVoices=window.speechSynthesis.getVoices();resolve(S.availVoices);},2000);
  });
}
function renderVoiceSelector(){
  const zh=S.availVoices.filter(v=>v.lang.includes('zh'));
  const allVoices=zh.length>=2?zh:S.availVoices.filter(v=>v.lang.includes('zh')||v.lang.includes('en')||v.name.includes('Microsoft'));
  const voices=allVoices.length>=2?allVoices.slice(0,8):S.availVoices.slice(0,8);
  if(!voices.length){document.getElementById('voiceSelector').innerHTML='<span>🎤 声音：默认</span>';return;}
  let h='<span>🎤 声音：</span>';
  voices.forEach((v,i)=>{
    const label=v.name.replace(/Microsoft\s*/i,'').replace(/Online.*$/,'').replace(/Desktop.*$/,'').replace(/\(Natural\)/,'').trim()||v.lang;
    h+='<div class="voice-opt'+(i===S.voiceIdx%voices.length?' selected':'')+'" onclick="selectVoice('+i+')">'+label+'</div>';
  });
  document.getElementById('voiceSelector').innerHTML=h;
}
function selectVoice(i){
  const zh=S.availVoices.filter(v=>v.lang.includes('zh'));
  const voices=zh.length>=2?zh.slice(0,8):S.availVoices.slice(0,8);
  S.voiceIdx=i;renderVoiceSelector();save();
  speak('你好，我是你的AI陶艺导师。试试这个声音怎么样？');
}
function getSelectedVoice(){
  const zh=S.availVoices.filter(v=>v.lang.includes('zh'));
  const voices=zh.length>=2?zh.slice(0,8):S.availVoices.slice(0,8);
  if(!voices.length)return null;
  return voices[S.voiceIdx%voices.length];
}

  S.tts=true;u.onend=u.onerror=()=>{S.tts=false;updateVoiceBtn();document.getElementById('ttsBtn').classList.remove('playing');document.getElementById('ttsBtn').innerHTML='<svg width=22 height=22 viewBox="0 0 24 24" fill=none stroke=currentColor stroke-width=1.8 stroke-linecap=round stroke-linejoin=round><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M19.1 4.9a10 10 0 010 14.2"/><path d="M15.5 8.5a5 5 0 010 7.1"/></svg>';};
  setTimeout(()=>window.speechSynthesis.speak(u),30);
}

function toggleAIVoice(){if(S.tts){stopAIVoice();return;}S.av=true;const step=EMBEDDED.steps[S.cs-1];if(!step)return;let t=step.name+'。'+step.tagline+'。';step.subs.forEach((s,i)=>{t+='第'+(i+1)+'步：'+s.a+'。'+s.d+'。';});speak(t);updateVoiceBtn();}

function showQuickAsk(){document.getElementById('quickAskInput').focus();}
function sendQuickAsk(){
  const inp=document.getElementById('quickAskInput');const q=inp.value.trim();if(!q)return;
  aiChat('👤',q);inp.value='';

// ============ QUICK REPLIES ============
function updateQuickReplies(){
  const step=EMBEDDED.steps[S.cs-1];
  if(!step)return;
  const replies=[
    '这一步要注意什么？',
    '我的'+step.name+'做对了吗？',
    '常见的错误有哪些？',
    '下一步是什么？'
  ];
  if(step.checks&&step.checks[0]){
    replies.push(step.checks[0].q);
  }
  document.getElementById('quickReplies').innerHTML=replies.map(r=>
    '<div class="quick-reply" onclick="sendQuickReply(\''+r.replace(/'/g,'&#39;')+'\')">'+r+'</div>'
  ).join('');
}
function sendQuickReply(text){
  aiChat('👤',text);
  const ans=findAnswer(text);
  setTimeout(()=>{aiChat('<i class="ri-robot-line" style="font-size:14px;vertical-align:-0.15em"></i>',ans);speak(ans);},300);
}
function findAnswer(q){
  const stopSet=new Set(['怎么办','是什么','为什么','有什么区别','要注意','有什么','怎么做','如何','哪个','怎么','什么','应该','需要','的方法','的技巧','怎样','怎么样','在哪','哪里','哪些','注意','要不要']);
  // Clean: strip punctuation, then remove stop phrases
  let clean=q.toLowerCase().replace(/[？?！!，,。.、\s]+/g,'');
  for(const st of stopSet){clean=clean.split(st).join('');}
  if(!clean)clean=q.replace(/[？?！!，,。.、\s]+/g,''); // fallback if everything was stripped

  // 1. Search errors
  let best=null,bestS=0;
  for(const e of EMBEDDED.errors){
    let s=0;for(const kw of e.kw){if(clean.includes(kw))s+=kw.length*3;}
    if(e.s.toLowerCase().replace(/[？?！!，,。.、\s]+/g,'').includes(clean))s+=10;
    if(s>bestS){bestS=s;best=e;}
  }
  if(best&&bestS>=3)return '关于<strong>'+best.s+'</strong>：'+best.cr.st.join('；')+'。'+best.cr.tp;
  // 2. Search step subs
  const step=EMBEDDED.steps[S.cs-1];
  if(step){
    let bestSub=null,subS=0;
    for(const sub of step.subs){
      const t=(sub.a+sub.d).toLowerCase();
      let s=0;
      // ngram 2-4 on clean keyword
      for(let len=4;len>=2;len--){
        for(let i=0;i<=clean.length-len;i++){
          if(t.includes(clean.slice(i,i+len)))s+=len*1.5;
        }
      }
      // Also check original query against sub text
      const orig=q.replace(/[？?！!，,。.、\s]+/g,'');
      if(t.includes(orig))s+=15;
      for(const ch of clean){if(t.includes(ch))s+=0.5;}
      if(s>subS){subS=s;bestSub=sub;}
    }
    if(bestSub&&subS>=2)return '关于这个问题：'+bestSub.a+'——'+bestSub.d;
    // Fallback: step summary
    if(subS>=1)return '关于<strong>'+step.name+'</strong>：'+step.subs.map(s=>s.a).join('；')+'。';
  }
  return '这个问题我需要更多信息。你可以试试：1. 点击「👀 AI检查」让AI诊断你的操作 2. 在「🆘求助」菜单搜索具体症状 3. 或者问问真人教师。';
}
